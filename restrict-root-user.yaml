apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-root-user
  annotations:
    policies.kyverno.io/title: Restrict Root User
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Containers should not run as root (UID 0) to limit potential impact 
      of container compromise. This policy ensures runAsNonRoot is set to true.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: validate-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Running as root is prohibited. Containers must set securityContext.runAsNonRoot: true."
        pattern:
          spec:
            containers:
              - securityContext:
                  runAsNonRoot: true