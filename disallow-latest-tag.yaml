# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/kyverno.io/clusterpolicy_v1.json
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Image Tag
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      The ':latest' tag is mutable and can lead to unexpected changes or vulnerabilities
      if upstream images are modified. Workloads must use explicit semantic version tags
      or immutable SHA256 digests.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: validate-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Using ':latest' image tag or omitting tags is prohibited. Provide an explicit version tag or digest."
        pattern:
          spec:
            containers:
              - image: "!*:latest & *:* | *@*"
            =(initContainers):
              - image: "!*:latest & *:* | *@*"
            =(ephemeralContainers):
              - image: "!*:latest & *:* | *@*"
