# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.28.0/pod-v1.json
apiVersion: v1
kind: Pod
metadata:
  name: test-pod-bad-root
  labels:
    app.kubernetes.io/name: test-pod-bad-root
    security.lab/role: exploit-demo
    security.lab/threat-vector: root-execution
  annotations:
    description: >-
      Non-compliant workload attempting to run as default root (UID 0) without
      setting runAsNonRoot: true. Designed to verify admission rejection by
      Kyverno's 'restrict-root-user' ClusterPolicy.
    security.kyverno.io/expected-result: "Blocked by Kyverno admission webhook (403 Forbidden)"
spec:
  restartPolicy: Never
  containers:
    - name: nginx
      image: nginx:latest
      # Omitting securityContext.runAsNonRoot: true triggers admission failure
      # CPU and memory limits/requests are defined to satisfy require-limits.yaml
      resources:
        limits:
          cpu: "100m"
          memory: "128Mi"
        requests:
          cpu: "50m"
          memory: "64Mi"
